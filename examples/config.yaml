mode: server
server:
  host: 0.0.0.0
  port: 8080
  auth: none
  auth_file: null
client:
  local_host: 127.0.0.1
  local_port: 1080
  server_host: null
  server_port: 8080
logging:
  level: INFO
  format: "%(asctime)s - %(levelname)s - %(message)s"
  file: null
connection_pool:
  max_size: 100
  dns_cache_ttl: 300
  dns_servers:
    - 8.8.8.8 # Google DNS
    - 1.1.1.1 # Cloudflare DNS
    - 9.9.9.9 # Quad9 DNS
  disable_dns_cache: false
  dns_timeout: 2.0
  dns_retries: 3
